name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The suite imports the app, which boots MediaPipe/YOLO/torch singletons.
      # opencv-headless needs these system libs on the GitHub runner image.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Supabase is unreachable in CI; the app falls back to in-memory
          # state (which is what the tests exercise). SECRET_KEY is set so
          # session cookies are stable across requests.
          SECRET_KEY: ci-test-secret-key
        run: python -m pytest -q
