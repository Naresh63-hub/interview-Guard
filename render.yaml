services:
  - type: web
    name: interview-guard
    env: python
    buildCommand: pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --worker-class gthread --threads 4 --timeout 120 app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12.3"
      # Optional: add SUPABASE_URL and SUPABASE_KEY in Render Dashboard if cloud database is used
