services:
  - type: web
    name: interview-guard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 50 app:app
    envVars:
      - key: FLASK_DEBUG
        value: "0"
      - key: PORT
        value: "10000"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      # The user will need to supply these via the Render dashboard:
      # - SUPABASE_URL
      # - SUPABASE_KEY
      # - SECRET_KEY
      # - GOOGLE_CLIENT_ID (optional)
      # - GOOGLE_CLIENT_SECRET (optional)
      # - CORS_ORIGINS (e.g. https://your-frontend.com)
