services:
  - type: web
    name: interviewos-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet -w 1 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: OPENAI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: HOST_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
