<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Intervue — Full Audit Log</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
            rel="stylesheet"
        />
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" href="/static/styles.css" />
        <style>
            body { padding: 2rem; }
            .audit-container { max-width: 800px; margin: 0 auto; }
            .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
            .timeline { padding-left: 1rem; }
            .timeline-item { margin-bottom: 1.5rem; position: relative; padding-left: 2rem; border-left: 2px solid var(--border-color); }
            .timeline-item.critical { border-left-color: var(--danger-color); }
            .timeline-item .marker { position: absolute; left: -6px; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--border-color); }
            .timeline-item.critical .marker { background: var(--danger-color); box-shadow: 0 0 10px var(--danger-color); }
            .timeline-item .time { font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.25rem; display: block; }
            .timeline-item h5 { margin: 0 0 0.25rem; font-size: 1rem; color: var(--text-primary); }
            .timeline-item p { margin: 0; color: var(--text-secondary); font-size: 0.9rem; }
            .confidence { margin-left: 0.5rem; font-size: 0.8rem; padding: 0.1rem 0.4rem; border-radius: 4px; background: rgba(255,255,255,0.1); }
        </style>
    </head>
    <body>
        <div class="audit-container">
            <div class="header-bar">
                <h2><i class="ph-fill ph-list-plus"></i> Full Audit Log</h2>
                <button class="btn secondary" onclick="window.close()">Close Window</button>
            </div>
            <div class="timeline" id="full-timeline">
                <!-- Items will be injected here -->
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const timeline = document.getElementById('full-timeline');
                const logs = JSON.parse(sessionStorage.getItem('fullAuditLog') || '[]');
                
                if (logs.length === 0) {
                    timeline.innerHTML = '<p>No audit events recorded yet.</p>';
                    return;
                }

                // Since we push to array, they are in chronological order.
                // Reversing them shows newest at top, similar to the dashboard widget.
                logs.reverse().forEach(log => {
                    const item = document.createElement('div');
                    item.className = `timeline-item${log.isCritical ? ' critical' : ''}`;
                    item.innerHTML = `
                        <div class="marker"></div>
                        <div class="content">
                            <h5>${log.title} ${log.confidence ? `<span class="confidence">${log.confidence}</span>` : ''}</h5>
                            <p>${log.message}</p>
                        </div>
                        <span class="time">${log.timeStr}</span>
                    `;
                    timeline.appendChild(item);
                });
            });
        </script>
    </body>
</html>
