<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervue - Meeting Portal</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body.intervue-theme {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', sans-serif; margin: 0; padding: 20px; color: #fff;
        }
        .meeting-card {
            background: rgba(255,255,255,0.06); backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
            padding: 40px 36px; width: 100%; max-width: 440px;
        }
        .meeting-card h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px; }
        .meeting-card .subtitle { color: rgba(255,255,255,0.6); font-size: 0.9rem; margin-bottom: 28px; }
        .tab-bar { display: flex; gap: 4px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; font-weight: 600;
            cursor: pointer; background: transparent; color: rgba(255,255,255,0.6); font-size: 0.85rem; transition: all .2s; }
        .tab-btn.active { background: rgba(255,255,255,0.12); color: #fff; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.78rem; font-weight: 600; color: rgba(255,255,255,0.7); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .5px; }
        .form-group input { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.25); color: #fff; font-size: 0.95rem; box-sizing: border-box; }
        .form-group input:focus { outline: none; border-color: #7c6aef; }
        .btn-primary { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 700;
            font-size: 1rem; cursor: pointer; background: linear-gradient(135deg, #7c6aef, #5a4fcf); color: #fff; transition: transform .1s; }
        .btn-primary:active { transform: scale(0.98); }
        .error-msg { color: #ff6b6b; font-size: 0.82rem; margin-top: 10px; display: none; }
        .panel { display: none; }
        .panel.active { display: block; }
    </style>
</head>
<body class="intervue-theme">
    <div class="meeting-card">
        <h1>Intervue</h1>
        <p class="subtitle">AI-powered interview proctoring — no account required.</p>
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('host')">Create Interview</button>
            <button class="tab-btn" onclick="switchTab('candidate')">Join Interview</button>
        </div>

        <!-- Host: Create/Join as interviewer -->
        <div class="panel active" id="panel-host">
            <form id="hostForm" autocomplete="off">
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="hostName" placeholder="Interviewer name" required>
                </div>
                <div class="form-group">
                    <label>Interview Title (optional)</label>
                    <input type="text" id="hostTitle" placeholder="e.g. Backend Engineer Screening">
                </div>
                <div class="form-group">
                    <label>Meeting ID (leave blank to create new)</label>
                    <input type="text" id="hostMeetingId" placeholder="ABCDEF12" style="text-transform:uppercase">
                </div>
                <button type="submit" class="btn-primary">Start Interview</button>
                <p class="error-msg" id="hostError"></p>
            </form>
        </div>

        <!-- Candidate: Join with meeting ID -->
        <div class="panel" id="panel-candidate">
            <form id="candidateForm" autocomplete="off">
                <div class="form-group">
                    <label>Meeting ID</label>
                    <input type="text" id="candidateMeetingId" placeholder="ABCDEF12" required style="text-transform:uppercase">
                </div>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" id="candidateName" placeholder="Full name" required>
                </div>
                <button type="submit" class="btn-primary">Join Interview</button>
                <p class="error-msg" id="candidateError"></p>
            </form>
        </div>
    </div>

<script>
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach((b, i) => {
        b.classList.toggle('active', (tab === 'host' && i === 0) || (tab === 'candidate' && i === 1));
    });
    document.getElementById('panel-host').classList.toggle('active', tab === 'host');
    document.getElementById('panel-candidate').classList.toggle('active', tab === 'candidate');
}

document.getElementById('hostForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('hostError');
    errEl.style.display = 'none';
    const body = {
        hostName: document.getElementById('hostName').value.trim(),
        title: document.getElementById('hostTitle').value.trim() || 'Interview Session',
    };
    const mid = document.getElementById('hostMeetingId').value.trim().toUpperCase();
    if (mid) body.meetingId = mid;

    try {
        const res = await fetch('/api/host/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
            errEl.textContent = data.error || 'Request failed';
            errEl.style.display = 'block';
            return;
        }
        // Persist capability token in sessionStorage for page-level access
        sessionStorage.setItem('hostToken_' + data.meetingId, data.hostToken);
        window.location.href = '/host_dashboard/' + data.meetingId;
    } catch (ex) {
        errEl.textContent = 'Network error: ' + ex.message;
        errEl.style.display = 'block';
    }
});

document.getElementById('candidateForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('candidateError');
    errEl.style.display = 'none';
    const body = {
        meetingId: document.getElementById('candidateMeetingId').value.trim().toUpperCase(),
        displayName: document.getElementById('candidateName').value.trim(),
    };
    try {
        const res = await fetch('/api/candidate/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
            errEl.textContent = data.error || 'Request failed';
            errEl.style.display = 'block';
            return;
        }
        window.location.href = '/candidate_dashboard/' + data.meetingId;
    } catch (ex) {
        errEl.textContent = 'Network error: ' + ex.message;
        errEl.style.display = 'block';
    }
});
</script>
</body>
</html>
