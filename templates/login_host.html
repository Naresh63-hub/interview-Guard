<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Intervue — Host a Meeting</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <script src="https://unpkg.com/@phosphor-icons/web"></script>
        <link rel="stylesheet" href="/static/styles.css" />
    </head>
    <body class="intervue-theme">
        <div class="intervue-container">
            <div class="intervue-logo">
                <i class="ph-fill ph-eye"></i><i class="ph-fill ph-shield-check" style="color: #3b82f6; margin-left: -0.5rem;"></i>
                Intervue
            </div>
            
            <div id="setup-view">
                <h2 class="intervue-title">Host a Meeting</h2>
                <p class="intervue-subtitle">Please enter your details.</p>

                <input
                    id="hostName"
                    class="intervue-input"
                    type="text"
                    placeholder="Your Name (e.g., Naresh)"
                    style="margin-bottom: 12px;"
                />

                <input
                    id="hostPassword"
                    class="intervue-input"
                    type="password"
                    placeholder="Host Password (default: admin123)"
                />

                <button class="intervue-btn primary" onclick="createMeeting()">Create Meeting</button>
                <a href="/" class="intervue-link">Back</a>
            </div>

            <div id="result-view" class="intervue-result">
                <h3>Meeting created!</h3>
                
                <div class="intervue-copy-row">
                    <input type="text" id="meetingLink" class="intervue-input" readonly style="margin-bottom:0;">
                    <button class="intervue-btn secondary" style="width:auto; margin-bottom:0;" onclick="copyLink()">Copy Invitation</button>
                </div>
                
                <button class="intervue-btn primary" onclick="joinAsHost()">Join as Host</button>
            </div>
        </div>

        <script>
            let currentMeetingId = "";
            let generatedLink = "";
            
            const APP_ORIGIN =
                window.location.port === "5500"
                    ? "https://127.0.0.1:5000"
                    : window.location.origin;

            async function createMeeting() {
                const hostName = document.getElementById("hostName").value.trim() || "Host";
                const password = document.getElementById("hostPassword").value.trim();
                const payload = {
                    hostName: hostName,
                    password: password,
                    title: "Interview Session"
                };

                try {
                    const response = await fetch(`${APP_ORIGIN}/create-room`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        currentMeetingId = data.meetingId;
                        
                        localStorage.setItem("role", "interviewer");
                        localStorage.setItem("displayName", hostName);
                        
                        // Construct absolute link using the signed link from response
                        generatedLink = `${APP_ORIGIN}${data.link}`;
                        document.getElementById("meetingLink").value = generatedLink;
                        
                        document.getElementById("setup-view").style.display = "none";
                        document.getElementById("result-view").style.display = "block";
                    } else {
                        const err = await response.json();
                        alert(err.error || "Invalid host credentials.");
                    }
                } catch (e) {
                    alert("Could not connect to backend to create meeting.");
                }
            }

            function copyLink() {
                const linkInput = document.getElementById("meetingLink");
                linkInput.select();
                document.execCommand("copy");
                alert("Invitation copied to clipboard!");
            }

            function joinAsHost() {
                if(currentMeetingId) {
                    window.location.href = `${APP_ORIGIN}/host_dashboard/${currentMeetingId}`;
                }
            }
        </script>
    </body>
</html>
